[project]
name = "kratos-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thirumalai-Tech-Developer", email = "thirutechdeveloper@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.15.0",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.141.1",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "pyinstaller>=6.10.0",
    "rich>=15.0.0",
    "uvicorn>=0.52.4",
    "sounddevice>=0.5.6",
    "opencv-python>=5.0.0.93",
    "mss>=10.2.0",
    "google-genai>=2.24.0",
    "pyautogui>=0.9.54",
    "psutil>=7.2.2",
    "pygetwindow>=0.0.9",
    "rapidocr-onnxruntime>=1.3.0",
    "comtypes>=1.4.1",
    "playwright>=1.63.0",
    "mcp>=2.0.0,<3.0",
    "json5>=0.15,<1",
]

[project.scripts]
kratos = "kratos_agent:main"
kratos-agent = "kratos_agent:main"

[project.optional-dependencies]
benchmark = [
    "harbor>=0.23.0",
]
headroom = [
    "headroom-ai>=0.37.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
