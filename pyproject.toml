[project]
name = "kratos-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thirumalai-Tech-Developer", email = "thirutechdeveloper@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.15.0",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.141.1",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "pyinstaller>=6.10.0",
    "rich>=15.0.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
kratos-agent = "kratos_agent:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
